on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "client/**"
      - ".github/workflows/client.yml"

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm biome ci
          pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        env:
          SESSION_SECRET: ${{ secrets.CLIENT_SESSION_SECRET }}
        run: |
          secrets_file="${RUNNER_TEMP}/client-secrets.json"
          jq -n --arg secret "$SESSION_SECRET" '{SESSION_SECRET: $secret}' > "$secrets_file"
          pnpm wrangler deploy --secrets-file "$secrets_file"
