# The containers are restarted after a reboot of the server.
services:
  caddy:
    image: frigodons/caddy:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

  php-api:
    image: frigodons/php-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0

  worker:
    image: frigodons/php-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0

  database:
    restart: unless-stopped
    # Only reachable from the server itself, e.g. through an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"

  pg-backup:
    image: frigodons/pg-backup:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAMES=${DATABASE_NAME}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - BACKUP_S3_HOST=${BACKUP_S3_HOST}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY}
