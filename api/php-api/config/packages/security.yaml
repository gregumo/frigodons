security:
  providers:
    users:
      entity:
        class: App\Entity\User
        property: id

  role_hierarchy:
    ROLE_VOLUNTEER: ROLE_USER
    ROLE_MANAGER: ROLE_USER

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      stateless: true
      provider: users
      jwt: ~
