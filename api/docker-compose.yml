services:
  caddy:
    depends_on:
      - php-api
    volumes:
      - caddy_data:/data

  php-api:
    environment:
      - CORS_ALLOW_ORIGIN=${APP_URL}
      - APP_SECRET=${APP_SECRET}
      - APP_URL=${APP_URL}
      - DATABASE_URL=postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      - MAILER_DSN=${MAILER_DSN}
      - MAILER_FROM=${MAILER_FROM}
      - MAILER_FROM_NAME=${MAILER_FROM_NAME}
      - MAILER_REPLY_TO=${MAILER_REPLY_TO}
      - MAILER_REPLY_TO_NAME=${MAILER_REPLY_TO_NAME}

  database:
    image: postgres:18.3
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  caddy_data:
  database_data:
